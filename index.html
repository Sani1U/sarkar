<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>  জীববিজ্ঞান MCQ | Board Exam</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#eef1f4;
    margin:0;
}
.container{
    max-width:650px;
    margin:20px auto;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 3px 8px rgba(0,0,0,.1);
}
h1,h2{text-align:center}
input,button{padding:10px;margin:5px 0}
button{cursor:pointer}
.hidden{display:none}
.top{display:flex;justify-content:space-between;font-weight:bold}
.question{font-size:18px;margin:15px 0}
.options button{
    width:100%;
    text-align:left;
    border:1px solid #bbb;
    background:#f9f9f9;
}
.options button.selected{
    background:#dbeafe;
    border-color:#2563eb;
}
.nav button{margin:2px;width:35px}
.progress{height:8px;background:#ddd;margin:10px 0}
.progress div{height:100%;background:#3498db;width:0%}
.review-item{border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:6px}
.review-item.correct{background:#e6fffa}
.review-item.wrong{background:#ffe6e6}
.nav button.answered{
    background:#2563eb;
    color:#fff;
    border-color:#2563eb;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
<h1>পরীক্ষার্থী লগইন</h1>
<input id="name" placeholder="তোমার নাম লেখো">
<button onclick="startExam()">Start Exam</button>
</div>

<!-- QUIZ -->
<div class="container hidden" id="quizBox">
<div class="top">
<div id="qno"></div>
<div id="timer"></div>
</div>

<div class="progress"><div id="bar"></div></div>
<div class="question"></div>
<div class="options"></div>
<div class="nav" id="nav"></div>

<button onclick="finish()">Submit</button>
</div>

<!-- RESULT -->
<div class="container hidden" id="resultBox">
<h2>📊 পরীক্ষার ফলাফল</h2>
<p id="student"></p>
<p id="correct"></p>
<p id="wrong"></p>
<p id="score"></p>
<p id="accuracy"></p>
<button onclick="restart()">🔄 আবার শুরু করো</button>
</div>

<!-- REVIEW -->
<div class="container hidden" id="reviewBox">
<h2>📝 Answer Review</h2>
<div id="reviewList"></div>
<button onclick="restart()">🔄 আবার শুরু করো</button>
</div>

<script>
/* ===== JULY MOVEMENT MCQ ===== */

const questions = [

{q:"সাধারণ চাপ ও উষ্ণতায় নিম্নের কোন পদার্থের আকার এবং আয়তন দুটোই নির্দিষ্ট থাকে?", 
o:["চিনি","অক্সিজেন","সয়াবিন তেল","পানি"], 
a:0},

{q:"মিথেন (CH₄), অক্সিজেন (O₂), নাইট্রোজেন (N₂), কার্বন (C) — গ্যাসগুলোর কোনটি নিঃসরণের হার কম?", 
o:["CH₄","O₂","N₂","C"], 
a:1},

{q:"কোনটি উদ্বায়ী পদার্থ?", 
o:["মোম","বালি","ইথার","লবণ"], 
a:2},

{q:"জলীয়বাষ্পকে যখন ঘনীভবন করা হয়, তখন কণাসমূহের ক্ষেত্রে কী ঘটবে?", 
o:["আকার সংকুচিত হবে","চলাচল করতে থাকবে","একই অবস্থানে থেকে কাঁপতে থাকবে","পরিপার্শ্বে শক্তি নির্গত করবে"], 
a:3},
    
{q:"মোম জ্বালানোর সময় কী ধরনের পরিবর্তন ঘটে?", 
o:["রাসায়নিক পরিবর্তন","ভৌত পরিবর্তন","ভৌত ও রাসায়নিক উভয় ধরনের পরিবর্তন হয়","রূপান্তরকরণ পরিবর্তণ"], 
a:2},

{q:"মোমবাতির দহনের সময় মোম কোনটির সাথে বিক্রিয়া করে?", 
o:["CO₂","O₂","H₂O","Fe₃O₄"], 
a:1},

{q:"সাধারণ লবণের গলনাঙ্ক ও স্ফুটনাঙ্ক বেশি। কারণ—", 
o:["লবণের আন্তঃআণবিক শক্তি কম","লবণের আন্তঃআণবিক শক্তি বেশি","লবণ বেশি তাপমাত্রা শোষণ করে","লবণ সাধারণ তাপমাত্রায় গলে না"], 
a:1},

{q:"গ্যাস সিলিন্ডার থেকে ছিদ্র পথে সজোরে গ্যাস বেরিয়ে গন্ধ ছড়ানোকে কী বলে?", 
o:["ব্যাপন","মিশ্রেণ","নিঃসরণ","প্রস্বেদন"], 
a:2},

{q:"বস্তুর ভর ও ঘনত্ব যত বেশি হয় ব্যাপন ও নিঃসরণের হার—", 
o:["বৃদ্ধি পায়","হ্রাস পায়","অপরিবর্তিত থাকে","সামান্য"], 
a:1},

{q:"মোমের দহনের ফলে কোনটি উৎপন্ন হয়?", 
o:["CO₂","H₂O","CO₂ (g) ও H₂O (g)","CO₂ (g) ও H₂O (l)"], 
a:2},

{q:"“চাপে আয়তন স্বল্পমাত্রায় সংকোচনশীল” কোনটির ক্ষেত্রে প্রযোজ্য?", 
o:["হিলিয়াম গ্যাস","মার্বেল","দুধ","কাঠ"], 
a:3},

{q:"কোনটির ব্যাপন হার সবচেয়ে বেশি?", 
o:["He","H₂","O₂","CO₂"], 
a:1},

{q:"গতিশক্তির মান আন্তঃকণা আকর্ষণ বল এর চেয়ে বেশি হলে পদার্থ কোন অবস্থা লাভ করবে?", 
o:["কঠিন","তরল","গ্যাসীয়","প্লাজমা"], 
a:2},

{q:"কোনো কোনো কঠিন পদার্থকে তাপ দিলে সরাসরি বাষ্পে পরিণত হওয়ার প্রক্রিয়াকে বলে—", 
o:["গলন","বাষ্পীভবন","রাসায়নিক পরিবর্তন","উর্ধ্বপাতন"], 
a:3},

{q:"নিচের কোনটি তাপ প্রয়োগে সরাসরি কঠিন থেকে বাষ্পে পরিণত হয়?", 
o:["কঠিন CO₂","লবণ","SiO₂","Na"], 
a:0},

{q:"তাপে পদার্থের কোনটির পরিবর্তন ঘটে না?", 
o:["আকার","আকৃতি","অণুর গঠন","ভৌত অবস্থা"], 
a:2},

{q:"নিম্নের কোনটির নিঃসরণ দ্রুত ঘটে?", 
o:["মিথেন","নাইট্রোজেন","নাইট্রোজেন ডাই অক্সাইড","প্রোপেন"], 
a:0},

{q:"তাপ প্রয়োগে কঠিন থেকে সরাসরি বাষ্পে পরিণত হওয়া পদার্থকে কোন প্রক্রিয়ায় পুনরায় কঠিন পদার্থে পরিণত করা যায়?", 
o:["বাষ্পীভবন","তরলীকরণ","শীতলীকরণ","ঘনীভবন"], 
a:2},

{q:"পদার্থের কোন অবস্থায় অণুসমূহের গতিশক্তি সবচেয়ে বেশি?", 
o:["কঠিন","তরল","গ্যাসীয়","আয়নিক"], 
a:2},

{q:"তাপ ও চাপের উপর নির্ভর করে পদার্থ কয়টি ভৌত অবস্থায় থাকতে পারে?", 
o:["২টি","৩টি","৪টি","৫টি"], 
a:1},

{q:"কখন গ্যাসীয় পদার্থের কণাসমূহ তরলের উপরিতল থেকে বাইরে বেরিয়ে যায়?", 
o:["গলনাঙ্কে পৌঁছালে","হিমাঙ্কে পৌঁছালে","স্ফুটনাঙ্কে পৌঁছালে","শিশিরাঙ্কে পৌঁছালে"], 
a:2},

{q:"আন্তঃআণবিক শক্তি কোন শক্তির বিপরীত?", 
o:["স্থিতিশক্তি","গতিশক্তি","বন্ধন শক্তি","বিভব শক্তি"], 
a:1},

{q:"নিচের কোনটি তরল পদার্থ?", 
o:["CaCO₂","C₆H₁₂O₆","CO₂","Hg"], 
a:3},

{q:"পানির স্ফুটনাঙ্ক কত?", 
o:["0°C","100°C","-259°C","-253°C"], 
a:1},

{q:"কোনটির প্রসারণশীলতা সবচেয়ে বেশি?", 
o:["চিনি","পারদ","পানি","অক্সিজেন গ্যাস"], 
a:3},

{q:"কোন অবস্থায় পদার্থের কণাসমূহের মধ্যে সর্বাধিক কম্পন, আবর্তন ও স্থানান্তর গতি রয়েছে?", 
o:["কঠিন","তরল","গ্যাসীয়","তরল স্ফটিক"], 
a:2},

{q:"কিসের প্রভাবে পদার্থের অবস্থার পরিবর্তন ঘটে?", 
o:["চাপের প্রভাবে","আঘাতের প্রভাবে","তাপমাত্রার প্রভাবে","ঘনমাত্রার প্রভাবে"], 
a:2},

{q:"আন্তঃআণবিক শক্তি বা আকর্ষণ কম হলে দূরত্ব—", 
o:["কমে যায়","বেড়ে যায়","অপরিবর্তিত থাকে","সামান্য কমে যায়"], 
a:1},

{q:"পটাসিয়াম পারম্যাঙ্গানেটকে পানিতে দ্রবীভূত করলে কী বর্ণ ধারণ করবে?", 
o:["বেগুনি","নীল","লাল","হলুদ"], 
a:0},

{q:"পদার্থের কণাসমূহের গতিশক্তির ফলে কী ঘটে?", 
o:["কণাসমূহ একত্রিত হয়","কণাসমূহ দূরে সরে যায়","কণাসমূহের মধ্যে আকর্ষণ বৃদ্ধি পায়","কণাসমূহের মধ্যে সংযোগ ঘটে"], 
a:1},

{q:"স্ফুটনাঙ্ক কিসের উপর নির্ভরশীল?", 
o:["তাপ","ভর","শক্তি","আন্তঃআণবিক শক্তি"], 
a:3},

{q:"পদার্থের কোন অবস্থায় কণাগুলো সবচেয়ে দূরে অবস্থান করে?", 
o:["কঠিন","তরল","গ্যাসীয়"], 
a:2}

];
/* প্রতি প্রশ্ন ০.৭৫ মিনিট */
let i=0,answers=new Array(questions.length).fill(null);
let time=questions.length*45;
let student="";

/* ===== rest code unchanged ===== */
function startExam(){
 student=document.getElementById("name").value;
 if(!student){alert("নাম লেখো");return;}
 loginBox.classList.add("hidden");
 quizBox.classList.remove("hidden");
 load(); startTimer();
}

function load(){
 qno.innerText=`প্রশ্ন ${i+1}/${questions.length}`;
 document.querySelector(".question").innerText=questions[i].q;
 let html="";
 questions[i].o.forEach((x,j)=>{
   let cls=answers[i]===j?"selected":"";
   html+=`<button class="${cls}" onclick="answer(${j})">${x}</button>`;
 });
 document.querySelector(".options").innerHTML=html;
 bar.style.width=((answers.filter(x=>x!==null).length/questions.length)*100)+"%";
 navigator();
}

function answer(a){
 answers[i]=a;
 let next=-1;
 for(let j=i+1;j<questions.length;j++) if(answers[j]===null){next=j;break;}
 if(next===-1) for(let j=0;j<i;j++) if(answers[j]===null){next=j;break;}
 if(next!==-1) i=next;
 load();
}

function navigator(){
 let n="";
 for(let j=0;j<questions.length;j++){
   let cls=answers[j]!==null?"answered":"";
   n+=`<button class="${cls}" onclick="go(${j})">${j+1}</button>`;
 }
 nav.innerHTML=n;
}

function go(x){i=x;load();}

function startTimer(){
 let t=setInterval(()=>{
   let m=Math.floor(time/60);
   let s=time%60;
   timer.innerText=`সময় ${m}:${String(s).padStart(2,"0")}`;
   time--; if(time<0){clearInterval(t);finish();}
 },1000);
}

function finish(){
 let score=0,reviewHTML="";
 answers.forEach((a,idx)=>{
   let ok=a===questions[idx].a;
   if(ok) score++;
   reviewHTML+=`
   <div class="review-item ${ok?"correct":"wrong"}">
   <p><b>প্রশ্ন ${idx+1}:</b> ${questions[idx].q}</p>
   <p>🟢 সঠিক উত্তর: ${questions[idx].o[questions[idx].a]}</p>
   <p>🔵 তোমার উত্তর: ${a!==null?questions[idx].o[a]:"উত্তর দাওনি"}</p>
   </div>`;
 });
 quizBox.classList.add("hidden");
 resultBox.classList.remove("hidden");
 studentEl.innerText="পরীক্ষার্থী: "+student;
 correct.innerText="✅ সঠিক: "+score;
 wrong.innerText="❌ ভুল: "+(questions.length-score);
 scoreEl.innerText=`মোট স্কোর: ${score}/${questions.length}`;
 accuracy.innerText=`Accuracy: ${((score/questions.length)*100).toFixed(2)}%`;
 reviewBox.classList.remove("hidden");
 reviewList.innerHTML=reviewHTML;
}

function restart(){location.reload();}

const loginBox=document.getElementById("loginBox");
const quizBox=document.getElementById("quizBox");
const resultBox=document.getElementById("resultBox");
const qno=document.getElementById("qno");
const timer=document.getElementById("timer");
const bar=document.getElementById("bar");
const nav=document.getElementById("nav");
const studentEl=document.getElementById("student");
const correct=document.getElementById("correct");
const wrong=document.getElementById("wrong");
const scoreEl=document.getElementById("score");
const accuracy=document.getElementById("accuracy");
const reviewBox=document.getElementById("reviewBox");
const reviewList=document.getElementById("reviewList");
</script>

</body>
</html>
